<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraKiosk Dashboard</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 { 
      margin-bottom: 50px; 
      font-size: 2.5rem; 
      letter-spacing: -1px; 
      font-weight: 700;
    }
    /* Launch Splash View */
    #splash-view {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .launch-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .launch-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
    }
    /* Main Kiosk Dashboard Area */
    #dashboard-view {
      display: none; /* Hidden until fullscreen is active */
      flex-direction: column;
      align-items: center;
    }
    .tray { 
      display: flex; 
      gap: 40px; 
    }
    .app-card {
      background: #1e293b;
      padding: 35px;
      border-radius: 24px;
      text-align: center;
      width: 140px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .app-card:hover { 
      transform: translateY(-8px); 
      background: #334155;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .icon { 
      font-size: 4rem; 
      margin-bottom: 20px; 
    }
    .name { 
      font-weight: 600; 
      font-size: 1.2rem; 
    }
    .close-card {
      background: #31151a;
      border: 2px solid #e11d48;
    }
    .close-card:hover {
      background: #4c1d24;
    }
  </style>
</head>
<body>

  <!-- 1. Click to go Fullscreen Trigger -->
  <div id="splash-view">
    <h1 style="margin-bottom: 30px;">AuraKiosk System</h1>
    <button class="launch-btn" onclick="enterKioskMode()">🚀 Start Kiosk Mode</button>
  </div>

  <!-- 2. The App Tray View -->
  <div id="dashboard-view">
    <h1>AuraKiosk Selection</h1>
    <div class="tray">
      <!-- App 1: Zeta AI -->
      <div class="app-card" onclick="launchKiosk('https://zeta-ai.io')">
        <div class="icon">🤖</div>
        <div class="name">Zeta</div>
      </div>

      <!-- App 2: Disney+ -->
      <div class="app-card" onclick="launchKiosk('https://disneyplus.com')">
        <div class="icon">✨</div>
        <div class="name">Disney+</div>
      </div>

      <!-- App 3: Close Selection -->
      <div class="app-card close-card" onclick="exitKioskMode()">
        <div class="icon">✕</div>
        <div class="name">Close & Exit</div>
      </div>
    </div>
  </div>

  <script>
    const splashView = document.getElementById('splash-view');
    const dashboardView = document.getElementById('dashboard-view');

    // Triggers browser native fullscreen mode and swaps the UI view
    function enterKioskMode() {
      const docElm = document.documentElement;
      if (docElm.requestFullscreen) {
        docElm.requestFullscreen();
      } else if (docElm.webkitRequestFullscreen) { /* Safari / older Chrome */
        docElm.webkitRequestFullscreen();
      }
      
      // Swap out layout frames
      splashView.style.display = 'none';
      dashboardView.style.display = 'flex';
    }

    // Opens target websites in dedicated popup windows
    function launchKiosk(url) {
      window.open(url, '_blank', 'popup=yes,fullscreen=yes,resizable=yes');
    }

    // Drops out of browser full screen and resets layout interface
    function exitKioskMode() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      
      // Reset back to main splash screen view
      dashboardView.style.display = 'none';
      splashView.style.display = 'flex';
    }

    // Listener to catch if someone drops out of fullscreen using the 'Esc' key manually
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        dashboardView.style.display = 'none';
        splashView.style.display = 'flex';
      }
    });
  </script>

</body>
</html>
