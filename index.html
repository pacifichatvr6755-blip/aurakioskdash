<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AuraKiosk Dashboard</title>
<style>
  body { background:#0f172a; color:#f8fafc; font-family:system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; overflow:hidden; }
  #splash-view, #dash-view { display:flex; flex-direction:column; align-items:center; width:90%; max-width:1000px; }
  #dash-view { display:none; height:80vh; gap:20px; }
  .header { display:flex; justify-content:space-between; width:100%; background:#1e293b; padding:15px 30px; border-radius:20px; box-sizing:border-box; font-weight:700; font-size:1.3rem; }
  .main { display:grid; grid-template-columns:300px 1fr; gap:20px; width:100%; height:100%; }
  .panel { background:#1e293b; border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:15px; box-sizing:border-box; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:15px; align-content:start; overflow-y:auto; padding:5px; height:100%; }
  .card { background:#0f172a; border:1px solid #334155; padding:20px 10px; border-radius:16px; text-align:center; cursor:pointer; position:relative; font-weight:600; transition:transform 0.2s; }
  .card:hover { transform:translateY(-3px); background:#334155; }
  .del-btn { position:absolute; top:5px; right:5px; background:#e11d48; color:white; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  input, button { padding:10px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:white; font-weight:600; }
  .btn-primary { background:linear-gradient(135deg, #6366f1, #4f46e5); border:none; cursor:pointer; padding:15px 35px; border-radius:50px; font-size:1.2rem; }
  #kiosk-frame-container { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:99999; background:#000; }
  iframe { width:100%; height:100%; border:none; }
  .frame-back-btn { position:fixed; bottom:20px; right:20px; z-index:100000; background:#e11d48; color:white; border:none; border-radius:30px; padding:12px 24px; font-weight:bold; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.5); }
</style></head><body>

  <div id="splash-view">
    <h1 style="font-size:2.5rem; margin-bottom:20px;">AuraKiosk System</h1>
    <button class="btn-primary" onclick="toggleKiosk(true)">🚀 Initialize Station</button>
  </div>

  <div id="dash-view">
    <div class="header"><span>AURA // KIOSK</span><span id="clock" style="color:#6366f1">00:00:00 PM</span></div>
    <div class="main">
      <div class="panel">
        <h3 style="margin:0; text-transform:uppercase; color:#94a3b8; font-size:0.9rem;">Manage Web Apps</h3>
        <input type="text" id="app-name" placeholder="App Name (e.g. Google)">
        <input type="url" id="app-url" placeholder="URL (https://...)">
        <button onclick="addApp()" style="background:#6366f1; cursor:pointer;">➕ Add Application</button>
        <button onclick="toggleKiosk(false)" style="background:#31151a; border:1px solid #e11d48; color:#fda4af; cursor:pointer; margin-top:auto;">✕ Close Station</button>
      </div>
      <div class="panel"><div class="grid" id="apps-grid"></div></div>
    </div>
  </div>

  <div id="kiosk-frame-container">
    <button class="frame-back-btn" onclick="closeAppFrame()">✕ Exit App</button>
    <iframe id="kiosk-iframe"></iframe>
  </div>

  <script>
    let apps = JSON.parse(localStorage.getItem('ak_apps')) || [
      { name: 'YouTube', url: 'https://youtube.com', icon: '📺', core: true },
      { name: 'Zeta AI', url: 'https://zeta-ai.io', icon: '🤖', core: true },
      { name: 'Disney+', url: 'https://disneyplus.com', icon: '✨', core: true }
    ];

    function toggleKiosk(on) {
      if (on) { document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.(); }
      else { if(document.fullscreenElement) { document.exitFullscreen?.(); } closeAppFrame(); }
      document.getElementById('splash-view').style.display = on ? 'none' : 'flex';
      document.getElementById('dash-view').style.display = on ? 'flex' : 'none';
    }
    
    document.addEventListener('fullscreenchange', () => { 
      if (!document.fullscreenElement && document.getElementById('kiosk-frame-container').style.display !== 'block') {
        toggleKiosk(false); 
      }
    });

    function launchApp(url) {
      const container = document.getElementById('kiosk-frame-container');
      const iframe = document.getElementById('kiosk-iframe');
      iframe.src = `https://corsproxy.io{encodeURIComponent(url)}`;
      container.style.display = 'block';
    }

    function closeAppFrame() {
      document.getElementById('kiosk-frame-container').style.display = 'none';
      document.getElementById('kiosk-iframe').src = 'about:blank';
    }

    function renderApps() {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = '';
      apps.forEach((app, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div style="font-size:2.5rem; margin-bottom:8px;">${app.icon || '🌐'}</div><div>${app.name}</div>`;
        card.onclick = (e) => { if (!e.target.classList.contains('del-btn')) launchApp(app.url); };
        if (!app.core) {
          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '✕';
          delBtn.onclick = (e) => { e.stopPropagation(); removeApp(idx); };
          card.appendChild(delBtn);
        }
        grid.appendChild(card);
      });
      localStorage.setItem('ak_apps', JSON.stringify(apps));
    }

    function addApp() {
      const name = document.getElementById('app-name').value, url = document.getElementById('app-url').value;
      if (name && url) { apps.push({ name, url, icon: '🌐' }); renderApps(); document.getElementById('app-name').value = ''; document.getElementById('app-url').value = ''; }
    }

    function removeApp(idx) { apps.splice(idx, 1); renderApps(); }

    setInterval(() => document.getElementById('clock').textContent = new Date().toLocaleTimeString(), 1000);
    renderApps();
  </script>
</body></html>
